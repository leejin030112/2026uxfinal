const b64=(s)=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const VOX=b64(VOXB64), VC=b64(COLB64), N=B.n, S=B.s, LO=B.lo;

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(32,1,.1,100);
scene.add(new THREE.AmbientLight(0xffffff,.32));
const key=new THREE.DirectionalLight(0xfff0e6,1.25);key.position.set(-5,6,7);scene.add(key);
const rim=new THREE.DirectionalLight(0x8fb0ff,.45);rim.position.set(6,2,-5);scene.add(rim);

const IX=new Int16Array(N),IY=new Int16Array(N),IZ=new Int16Array(N);
const occ=new Map(), K=v=>((v[0]+512)*1024+(v[1]+512))*1024+(v[2]+512);
const geo=new THREE.BoxGeometry(S*.96,S*.96,S*.96);
const mesh=new THREE.InstancedMesh(geo,new THREE.MeshStandardMaterial({roughness:.85,metalness:0}),N);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const base=new Float32Array(N*3), dummy=new THREE.Object3D(), tmpC=new THREE.Color();
const cellPos=(ix,iy,iz,out)=>out.set(LO[0]+(ix+.5)*S,LO[1]+(iy+.5)*S,LO[2]+(iz+.5)*S);
const P0=new THREE.Vector3();
for(let i=0;i<N;i++){
  IX[i]=VOX[3*i];IY[i]=VOX[3*i+1];IZ[i]=VOX[3*i+2];occ.set(K([IX[i],IY[i],IZ[i]]),i);
  cellPos(IX[i],IY[i],IZ[i],P0);dummy.position.copy(P0);dummy.scale.setScalar(1);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);
  const j=1+(Math.random()-.5)*.08;   /* 면마다 살짝 다른 밝기 */
  tmpC.setRGB(VC[3*i]/255,VC[3*i+1]/255,VC[3*i+2]/255).convertSRGBToLinear().multiplyScalar(1.25*j);
  base[3*i]=tmpC.r;base[3*i+1]=tmpC.g;base[3*i+2]=tmpC.b;mesh.setColorAt(i,tmpC)}

const setColor=(i,mul,add)=>{tmpC.setRGB(base[3*i]*mul+add,base[3*i+1]*mul+add,base[3*i+2]*mul+add);mesh.setColorAt(i,tmpC);mesh.instanceColor.needsUpdate=true};
const setPos=(i,p,sc)=>{dummy.position.copy(p);dummy.scale.setScalar(sc);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);mesh.instanceMatrix.needsUpdate=true};

/* nearest free cells, for snapping */
const NEAR=[];for(let x=-6;x<=6;x++)for(let y=-6;y<=6;y++)for(let z=-6;z<=6;z++)NEAR.push([x,y,z,x*x+y*y+z*z]);NEAR.sort((a,b)=>a[3]-b[3]);

/* camera */
const target=new THREE.Vector3(0,1.2,0);let az=0,el=.08,dist=9;
function place(){camera.position.set(target.x+dist*Math.cos(el)*Math.sin(az),target.y+dist*Math.sin(el),target.z+dist*Math.cos(el)*Math.cos(az));camera.lookAt(target)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;dist=8.6/Math.min(1,camera.aspect*1.1);camera.updateProjectionMatrix();place()}
addEventListener('resize',resize);resize();

/* interaction */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(),pt=new THREE.Vector3(),camDir=new THREE.Vector3();
let hover=-1,grab=null,orbit=null,ptr={x:0,y:0},needPick=false;
const setNdc=(x,y)=>{ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera)};
function pick(){setNdc(ptr.x,ptr.y);const h=ray.intersectObject(mesh)[0];return h?h.instanceId:-1}
function setHover(i){if(i===hover)return;if(hover>=0&&!(grab&&grab.i===hover))setColor(hover,1,0);hover=i;if(i>=0&&!(grab&&grab.i===i))setColor(i,1,.22);canvas.classList.toggle('over',i>=0)}

canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptr={x:e.clientX,y:e.clientY};
  const i=pick();canvas.classList.add('drag');
  if(i>=0){const c=new THREE.Vector3();cellPos(IX[i],IY[i],IZ[i],c);camera.getWorldDirection(camDir);plane.setFromNormalAndCoplanarPoint(camDir,c);
    ray.ray.intersectPlane(plane,pt);grab={i,off:c.clone().sub(pt),cur:c.clone()};setColor(i,1,.35);setPos(i,c,1.2)}
  else orbit={x:e.clientX,y:e.clientY}});
function drag(){setNdc(ptr.x,ptr.y);if(ray.ray.intersectPlane(plane,pt)){grab.cur.copy(pt).add(grab.off);setPos(grab.i,grab.cur,1.2)}}
canvas.addEventListener('pointermove',e=>{ptr={x:e.clientX,y:e.clientY};
  if(grab)drag();
  else if(orbit){az-=(e.clientX-orbit.x)*.007;el=Math.max(-.3,Math.min(1.3,el+(e.clientY-orbit.y)*.005));orbit.x=e.clientX;orbit.y=e.clientY;place()}
  else needPick=true});
canvas.addEventListener('wheel',e=>{e.preventDefault();if(!grab)return;camera.getWorldDirection(camDir);plane.translate(camDir.clone().multiplyScalar(-e.deltaY*.004));drag()},{passive:false});

function release(){
  if(grab){const i=grab.i,c=grab.cur;
    const g=[Math.round((c.x-LO[0])/S-.5),Math.round((c.y-LO[1])/S-.5),Math.round((c.z-LO[2])/S-.5)];
    occ.delete(K([IX[i],IY[i],IZ[i]]));
    let cell=g;for(const o of NEAR){const t=[g[0]+o[0],g[1]+o[1],g[2]+o[2]];if(!occ.has(K(t))){cell=t;break}}   /* 가장 가까운 빈 칸에 맞춰 붙음 */
    IX[i]=cell[0];IY[i]=cell[1];IZ[i]=cell[2];occ.set(K(cell),i);
    cellPos(cell[0],cell[1],cell[2],P0);setPos(i,P0,1);setColor(i,1,0);hover=-1;grab=null}
  orbit=null;canvas.classList.remove('drag')}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('pointerleave',()=>{if(!grab&&!orbit)setHover(-1)});

function reset(){occ.clear();for(let i=0;i<N;i++){IX[i]=VOX[3*i];IY[i]=VOX[3*i+1];IZ[i]=VOX[3*i+2];occ.set(K([IX[i],IY[i],IZ[i]]),i);cellPos(IX[i],IY[i],IZ[i],P0);setPos(i,P0,1);setColor(i,1,0)}hover=-1}
document.getElementById('reset').addEventListener('click',reset);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')reset()});

(function loop(){requestAnimationFrame(loop);if(needPick&&!grab&&!orbit){needPick=false;setHover(pick())}renderer.render(scene,camera)})();
</script></body></html>
