const S=A.s, AW=A.T*A.TPR;
const FACES=[{n:[0,0,1],r:[1,0,0],u:[0,1,0]},{n:[0,0,-1],r:[-1,0,0],u:[0,1,0]},{n:[1,0,0],r:[0,0,-1],u:[0,1,0]},
             {n:[-1,0,0],r:[0,0,1],u:[0,1,0]},{n:[0,1,0],r:[1,0,0],u:[0,0,-1]},{n:[0,-1,0],r:[1,0,0],u:[0,0,1]}];

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,1,.1,100);
scene.add(new THREE.AmbientLight(0xffffff,.55));
const key=new THREE.DirectionalLight(0xffffff,.95);key.position.set(-4,7,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xffe6d8,.35);fill.position.set(6,2,4);scene.add(fill);
const grid=new THREE.GridHelper(14,28,0x262626,0x141414);grid.position.y=-0.002;scene.add(grid);

const tex=new THREE.TextureLoader().load(ATLAS);tex.encoding=THREE.sRGBEncoding;tex.generateMipmaps=false;tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;
const mat=new THREE.MeshStandardMaterial({map:tex,roughness:.9,metalness:0});

function cubeGeo(ci){
  const h=S*.5*.985,pos=[],nor=[],uv=[],idx=[],ins=.75;
  FACES.forEach((f,fi)=>{const t=ci*6+fi,col=t%A.TPR,row=Math.floor(t/A.TPR);
    const u0=(col*A.T+ins)/AW,u1=((col+1)*A.T-ins)/AW,vt=1-(row*A.T+ins)/AW,vb=1-((row+1)*A.T-ins)/AW,base=pos.length/3;
    for(const [a,b,x,y] of [[-1,-1,u0,vb],[1,-1,u1,vb],[1,1,u1,vt],[-1,1,u0,vt]]){
      pos.push((f.n[0]+a*f.r[0]+b*f.u[0])*h,(f.n[1]+a*f.r[1]+b*f.u[1])*h,(f.n[2]+a*f.r[2]+b*f.u[2])*h);nor.push(...f.n);uv.push(x,y)}
    idx.push(base,base+1,base+2,base,base+2,base+3)});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);return g}

const cubes=A.cubes.map((c,ci)=>{
  const m=new THREE.Mesh(cubeGeo(ci),mat);
  m.userData.home=new THREE.Vector3((c[0]-1)*S,(c[1]+.5)*S,(c[2]-1)*S);   /* 원래 머리 속 위치, 바닥에 놓임 */
  m.position.copy(m.userData.home);m.userData.anim=null;scene.add(m);return m});

/* ---- animation ---- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function moveTo(m,p,q,delay,dur,lift){m.userData.anim={p0:m.position.clone(),q0:m.quaternion.clone(),p1:p,q1:q,t0:performance.now()+delay,dur,lift}}
function tick(now){for(const m of cubes){const a=m.userData.anim;if(!a)continue;
  const u=Math.min(1,Math.max(0,(now-a.t0)/a.dur));if(now<a.t0)continue;const e=ease(u);
  m.position.lerpVectors(a.p0,a.p1,e);m.position.y+=a.lift*Math.sin(Math.PI*u);m.quaternion.copy(a.q0).slerp(a.q1,e);
  if(u>=1)m.userData.anim=null}}
const AX=[new THREE.Vector3(1,0,0),new THREE.Vector3(0,1,0),new THREE.Vector3(0,0,1)];
function randomOrientation(){const q=new THREE.Quaternion();for(let k=0;k<3;k++)q.premultiply(new THREE.Quaternion().setFromAxisAngle(AX[Math.floor(Math.random()*3)],Math.floor(Math.random()*4)*Math.PI/2));return q}

/* ---- new stack: 3x3 footprint, columns of different heights, random orientations ---- */
function stack(){
  const order=[...cubes.keys()].sort(()=>Math.random()-.5), h=Array(9).fill(0), gap=1.03*S;
  order.forEach((ci,k)=>{
    let tot=0;const w=h.map((hh,g)=>{const gx=g%3,gz=Math.floor(g/3),cen=(gx===1&&gz===1)?1.7:(gx===1||gz===1)?1.1:.7;return cen/Math.pow(1+hh,1.3)});
    w.forEach(x=>tot+=x);let r=Math.random()*tot,g=0;for(;g<8;g++){r-=w[g];if(r<=0)break}
    const gx=g%3-1,gz=Math.floor(g/3)-1,y=S*.5+h[g]*S;h[g]++;
    const p=new THREE.Vector3(gx*gap+(Math.random()-.5)*.1*S,y,gz*gap+(Math.random()-.5)*.1*S);
    const q=new THREE.Quaternion().setFromAxisAngle(AX[1],(Math.random()-.5)*.36).multiply(randomOrientation());
    moveTo(cubes[ci],p,q,k*45,1500,S*(1.3+Math.random()*.7))});
}
function home(){cubes.forEach((m,k)=>moveTo(m,m.userData.home.clone(),new THREE.Quaternion(),k*30,1300,S*1.1))}
document.getElementById('stack').addEventListener('click',stack);
document.getElementById('home').addEventListener('click',home);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();stack()}if(e.key==='h'||e.key==='H')home()});

/* ---- camera + click-to-rotate ---- */
const target=new THREE.Vector3(0,1.25,0);let az=0,el=.2,dist=9;
function place(){camera.position.set(target.x+dist*Math.cos(el)*Math.sin(az),target.y+dist*Math.sin(el),target.z+dist*Math.cos(el)*Math.cos(az));camera.lookAt(target)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;dist=9/Math.min(1,camera.aspect*1.1);camera.updateProjectionMatrix();place()}
addEventListener('resize',resize);resize();
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let down=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),moved:0}});
canvas.addEventListener('pointermove',e=>{if(!down)return;down.moved+=Math.abs(e.clientX-down.lx)+Math.abs(e.clientY-down.ly);
  if(down.moved>5){az-=(e.clientX-down.lx)*.007;el=Math.max(-.05,Math.min(1.3,el+(e.clientY-down.ly)*.005));place()}down.lx=e.clientX;down.ly=e.clientY});
canvas.addEventListener('pointerup',e=>{const d=down;down=null;if(!d||d.moved>5||performance.now()-d.t>400)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const h=ray.intersectObjects(cubes)[0];if(!h)return;const m=h.object;if(m.userData.anim)return;
  const q=new THREE.Quaternion().setFromAxisAngle(AX[Math.floor(Math.random()*3)],(Math.random()<.5?1:-1)*Math.PI/2).multiply(m.quaternion);
  moveTo(m,m.position.clone(),q,0,350,S*.25)});
canvas.addEventListener('pointercancel',()=>{down=null});

(function loop(now){requestAnimationFrame(loop);tick(now);renderer.render(scene,camera)})(performance.now());
</script></body></html>
