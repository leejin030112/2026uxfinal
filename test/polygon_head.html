const b64=(s,T)=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer)};
const BASE=b64(VDATA,Float32Array), IDX=b64(FDATA,Uint16Array), N=BASE.length/3;

/* center the head on its bounding box so it rotates around itself */
{const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
 for(let i=0;i<N;i++)for(let k=0;k<3;k++){const x=BASE[3*i+k];if(x<mn[k])mn[k]=x;if(x>mx[k])mx[k]=x}
 for(let i=0;i<N;i++)for(let k=0;k<3;k++)BASE[3*i+k]-=(mn[k]+mx[k])/2}
let FLOOR=1e9;for(let i=0;i<N;i++)FLOOR=Math.min(FLOOR,BASE[3*i+1]);  /* 평평하게 잘린 바닥면의 높이 */

/* 얼굴을 세로 띠(방위각 36등분)로 나눈다. 잡은 높이 아래쪽 정점들만 y축으로 이동 → 그 높이에서 세로 줄무늬가 생김 */
const AZ=36, stripOf=new Int32Array(N), strips=Array.from({length:AZ},()=>[]), dY=new Float32Array(N);
for(let i=0;i<N;i++){const b=Math.floor((Math.atan2(BASE[3*i],BASE[3*i+2])+Math.PI)/(2*Math.PI)*AZ)%AZ;stripOf[i]=b;strips[b].push(i)}
const tailOf=(bin,cutY)=>strips[bin].filter(i=>BASE[3*i+1]<=cutY+1e-6);

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(32,1,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x221418,.55));
const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(-3,4,6);scene.add(key);
const rim=new THREE.DirectionalLight(0x9db4ff,.5);rim.position.set(4,1,-5);scene.add(rim);

const geo=new THREE.BufferGeometry();
const pos=new THREE.BufferAttribute(BASE.slice(),3), col=new THREE.BufferAttribute(new Float32Array(N*3),3);
geo.setAttribute('position',pos);geo.setAttribute('color',col);geo.setIndex(new THREE.BufferAttribute(IDX,1));
const C0=new THREE.Color('#e2b3a3'), C1=new THREE.Color('#fff0e6');
const paint=(list,c)=>{for(const i of list)col.setXYZ(i,c.r,c.g,c.b);col.needsUpdate=true};
for(let i=0;i<N;i++)col.setXYZ(i,C0.r,C0.g,C0.b);
geo.computeBoundingSphere();geo.computeBoundingBox();

const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.75,metalness:0,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
const wire=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.12}));
const head=new THREE.Group();head.add(mesh,wire);head.rotation.y=-.5;scene.add(head);

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.position.set(0,0,11/Math.min(1,camera.aspect*1.15));camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const refresh=()=>{pos.needsUpdate=true;geo.computeBoundingSphere();geo.computeBoundingBox()};
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const h=ray.intersectObject(mesh)[0];if(!h)return null;
  const p=mesh.worldToLocal(h.point.clone());let best=-1,bd=1e9;
  for(const i of [h.face.a,h.face.b,h.face.c]){const d=(BASE[3*i]-p.x)**2+(pos.getY(i)-p.y)**2+(BASE[3*i+2]-p.z)**2;if(d<bd){bd=d;best=i}}
  return {bin:stripOf[best],cutY:BASE[3*best+1],point:h.point}}

let hoverList=[],grab=null,orbit=null,idle=true;
const setHover=list=>{paint(hoverList,C0);hoverList=list;paint(list,C1);canvas.classList.toggle('over',list.length>0)};
const plane=new THREE.Plane(),pt=new THREE.Vector3();

canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const h=pick(e);canvas.classList.add('drag');
  if(h){const n=new THREE.Vector3();camera.getWorldDirection(n);plane.setFromNormalAndCoplanarPoint(n,h.point);
    grab={last:h.point.clone(),list:tailOf(h.bin,h.cutY)};setHover(grab.list)}
  else orbit={x:e.clientX,y:e.clientY};idle=false});
canvas.addEventListener('pointermove',e=>{
  if(grab){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
    if(ray.ray.intersectPlane(plane,pt)){const dy=pt.y-grab.last.y;grab.last.copy(pt);   /* 세로(y)만 사용 — x, z는 그대로 */
      for(const i of grab.list){dY[i]=Math.min(0,Math.max(FLOOR-BASE[3*i+1],dY[i]+dy));pos.setY(i,BASE[3*i+1]+dY[i])}refresh()   /* 바닥 아래로는 못 내려가고, 원래 높이보다 위로도 안 올라감 */}}
  else if(orbit){head.rotation.y+=(e.clientX-orbit.x)*.008;head.rotation.x=Math.max(-.8,Math.min(.8,head.rotation.x+(e.clientY-orbit.y)*.006));orbit.x=e.clientX;orbit.y=e.clientY}
  else{const h=pick(e);setHover(h?tailOf(h.bin,h.cutY):[])}});
const up=()=>{grab=orbit=null;canvas.classList.remove('drag');idle=true};  /* 놓으면 dY가 그대로 남아 고정 */
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('pointerleave',()=>{if(!grab&&!orbit)setHover([])});
canvas.addEventListener('dblclick',e=>{const h=pick(e);if(h){for(const i of strips[h.bin]){dY[i]=0;pos.setY(i,BASE[3*i+1])}refresh()}});
const reset=()=>{dY.fill(0);for(let i=0;i<N;i++)pos.setY(i,BASE[3*i+1]);refresh()};
document.getElementById('reset').addEventListener('click',reset);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')reset();if(e.key==='w'||e.key==='W')wire.visible=!wire.visible});

(function loop(){requestAnimationFrame(loop);if(idle)head.rotation.y+=.004;renderer.render(scene,camera)})();
